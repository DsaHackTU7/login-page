<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recyclo Login</title>

    <!-- Main Stylesheet (ONLY ONCE) -->
    <link rel="stylesheet" href="stylesheet.css">

    <!-- Icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">

        <!-- LEFT SIDE CONTENT -->
        <div class="content">
            <h2 class="logo"><i class='bx bx-hive'></i> recyclo</h2>

            <!-- Image -->
            <img src="new-removebg-preview.png" alt="Recycling process illustration" class="hero-img">

            <div class="text-sci">
                <h2>
                    Welcome! <br>
                    <span>Operational efficiency starts with knowing what you own</span>
                </h2>

                <p>Our socials :</p>

                <div class="social-icons">
                    <a href="#"><i class='bx bxl-linkedin'></i></a>
                    <a href="#"><i class='bx bxl-instagram'></i></a>
                    <a href="#"><i class='bx bxl-reddit'></i></a>
                    <a href="#"><i class='bx bx-x'></i></a>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE LOGIN BOX -->
        <div class="logreg-box">
            <div class="form-box_login">
                <form action="#">
                    <h2>Sign In</h2>

                    <div class="input-box">
                        <span class="icon"><i class='bx bxl-gmail'></i></span>
                        <input type="email" required>
                        <label>Email</label>
                    </div>

                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-lock-alt'></i></span>
                        <input type="password" required>
                        <label>Password</label>
                    </div>

                    <div class="remember-forgot">
                        <label><input type="checkbox"> Remember me</label>
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn">Sign In</button>

                    <div class="login-register">
                        <p>Don't have an account? <a href="#" class="register-link">Sign Up</a></p>
                    </div>
                </form>
            </div>
        </div>

    </div>
</body>
</html>
